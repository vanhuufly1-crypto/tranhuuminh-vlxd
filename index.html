<!DOCTYPE html>
<html lang="vi">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Trần Hữu Minh - VLXD & Chống Thấm</title>
 <style>
 body { font-family: sans-serif; margin: 0; padding: 10px; background: #f4f4f4; }
 .product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
 .product-card { background: white; padding: 10px; border-radius: 8px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
 .product-card h3 { font-size: 14px; margin: 5px 0; }
 .product-card button { background: #e74c3c; color: white; border: none; padding: 8px; width: 100%; border-radius: 4px; cursor: pointer; }
 #orderForm { background: white; padding: 20px; border-radius: 8px; }
 input, select { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
 </style>
</head>
<body>

 <h2>🔥 Sản phẩm (Sẵn kho)</h2>
 <div class="product-grid">
 <div class="product-card">
 <h3>Munich G20</h3>
 <button onclick="selectProduct('Munich G20')">Mua ngay</button>
 </div>
 <div class="product-card">
 <h3>Nano House</h3>
 <button onclick="selectProduct('Nano House')">Mua ngay</button>
 </div>
 </div>

 <form id="orderForm">
 <h3>📋 Đặt hàng nhanh</h3>
 <input type="text" name="name" placeholder="Họ tên *" required>
 <input type="tel" name="phone" placeholder="SĐT *" required pattern="[0-9]{10,11}">
 <input type="text" name="address" placeholder="Địa chỉ *" required>
 <select name="product" id="productSelect" onchange="checkDiscount()">
 <option value="">Chọn sản phẩm *</option>
 <option value="Munich G20">Munich G20</option>
 <option value="Nano House">Nano House</option>
 <option value="Sika">Sika</option>
 <option value="Dulux">Dulux</option>
 <option value="Jotun">Jotun</option>
 </select>
 <select name="discount" id="discountSelect">
 <option value="0">Chiết khấu 0%</option>
 </select>
 <button type="submit" style="width:100%;padding:15px;background:#27ae60;color:white;border:none;border-radius:4px;font-size:16px;font-weight:700;">🔥 ĐẶT HÀNG NGAY</button>
 </form>

 <script>
 function checkDiscount() {
  const product = document.getElementById('productSelect').value;
  const select = document.getElementById('discountSelect');
  select.innerHTML = '';
  let max = (product === "Munich G20" || product === "Nano House") ? 40 : (product === "Sika" ? 10 : 30);
  for(let i = 0; i <= max; i += 5) {
   select.innerHTML += `<option value="${i}">${i}%</option>`;
  }
 }
 function selectProduct(p) { document.getElementById('productSelect').value = p; checkDiscount(); window.scrollTo(0, document.body.scrollHeight); }
 document.getElementById('orderForm').onsubmit = async (e) => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(e.target));
  await fetch('/order', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) });
  alert('Đã gửi đơn hàng!');
 };
 </script>
</body>
</html>
